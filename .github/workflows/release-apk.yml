name: Production Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Firebase configuration (google-services.json)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          TARGET = "app/google-services.json"
          PKG = "com.aistudio.proxiafrik.vzkpmn"

          def is_valid_google_services(raw_text: str) -> tuple[bool, str]:
              try:
                  data = json.loads(raw_text)
              except Exception as exc:
                  return False, f"JSON invalide: {exc}"
              clients = data.get("client")
              if not isinstance(clients, list):
                  return False, "Champ 'client' manquant dans google-services.json"
              for client in clients:
                  pkg = (
                      client.get("client_info", {})
                      .get("android_client_info", {})
                      .get("package_name")
                  )
                  if pkg == PKG:
                      oauth_clients = client.get("oauth_client", [])
                      has_web_client = any(
                          isinstance(c, dict) and c.get("client_type") == 3
                          for c in oauth_clients
                      )
                      if not has_web_client:
                          return False, f"Client OAuth Web (client_type: 3) absent pour {PKG}"
                      return True, "OK"
              return False, f"Application {PKG} absente de google-services.json"

          def decode_secret(secret_value: str) -> tuple[str | None, str]:
              trimmed = secret_value.strip()
              if (trimmed.startswith('"') and trimmed.endswith('"')) or (
                  trimmed.startswith("'") and trimmed.endswith("'")
              ):
                  trimmed = trimmed[1:-1].strip()
              if trimmed.startswith("{"):
                  return trimmed, "raw JSON"
              if "base64," in trimmed[:64]:
                  trimmed = trimmed.split("base64,", 1)[1]
              compact = "".join(trimmed.split()).replace("-", "+").replace("_", "/")
              if not compact:
                  return None, "secret vide"
              padding = (-len(compact)) % 4
              compact_padded = compact + ("=" * padding)
              try:
                  decoded = base64.b64decode(compact_padded, validate=True).decode("utf-8")
                  return decoded, "Base64"
              except Exception as exc:
                  return None, f"Base64 invalide ({exc})"

          repo_valid = False
          if os.path.isfile(TARGET):
              with open(TARGET, "r", encoding="utf-8") as f:
                  repo_valid, repo_msg = is_valid_google_services(f.read())
          else:
              repo_msg = "fichier absent du dépôt"

          secret_val = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "")
          if secret_val.strip():
              decoded_text, mode = decode_secret(secret_val)
              if decoded_text is not None:
                  ok, msg = is_valid_google_services(decoded_text)
                  if ok:
                      os.makedirs(os.path.dirname(TARGET), exist_ok=True)
                      with open(TARGET, "w", encoding="utf-8") as f:
                          f.write(decoded_text)
                      print(f"app/google-services.json configuré via GOOGLE_SERVICES_JSON_BASE64 ({mode}).")
                      sys.exit(0)
                  else:
                      secret_err = msg
              else:
                  secret_err = mode

              if repo_valid:
                  print(f"::warning::GOOGLE_SERVICES_JSON_BASE64 ignoré ({secret_err}), utilisation du fichier app/google-services.json du dépôt.")
                  sys.exit(0)

              print(f"::error::Secret GOOGLE_SERVICES_JSON_BASE64 invalide ({secret_err}) et app/google-services.json absent du dépôt.")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as s:
                      s.write("### Erreur de configuration Firebase\n")
                      s.write(f"Le secret `GOOGLE_SERVICES_JSON_BASE64` est invalide ({secret_err}).\n\n")
                      s.write("Vous pouvez soit :\n")
                      s.write("1. Coller le contenu JSON complet de `app/google-services.json` (ou son Base64 exact sans coupure) dans `GOOGLE_SERVICES_JSON_BASE64`, **ou**\n")
                      s.write("2. Pousser `app/google-services.json` directement dans le dépôt et supprimer le secret `GOOGLE_SERVICES_JSON_BASE64`.\n")
              sys.exit(1)

          if repo_valid:
              print("Firebase app/google-services.json du dépôt vérifié.")
              sys.exit(0)

          print(f"::error::app/google-services.json invalide ou manquant ({repo_msg}).")
          sys.exit(1)
          PY

      - name: Determine release version tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Release version tag cannot be empty."
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "APK_FILENAME=PROXIAFRIK-${TAG}.apk" >> "$GITHUB_ENV"
          echo "Preparing release for tag: ${TAG}"

      - name: Validate required signing secrets
        env:
          CHECK_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          CHECK_STORE_PW: ${{ secrets.STORE_PASSWORD }}
          CHECK_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$CHECK_KEYSTORE" ] || [ -z "$CHECK_STORE_PW" ] || [ -z "$CHECK_KEY_PW" ]; then
            echo "::error::Missing required GitHub Secrets: KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD must all be configured in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required signing secrets are configured."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for unit tests
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit and Robolectric tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests 'com.example.ExampleRobolectricTest' --tests 'com.example.ExampleUnitTest' --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle-test.log

      - name: Decode and validate production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/proxiafrik-release.jks"
          KEYSTORE_FILE="$KEYSTORE_FILE" python3 - <<'PY'
          import base64
          import os
          import sys

          raw = os.environ.get("KEYSTORE_BASE64", "").strip()
          if (raw.startswith('"') and raw.endswith('"')) or (raw.startswith("'") and raw.endswith("'")):
              raw = raw[1:-1].strip()
          if "base64," in raw[:64]:
              raw = raw.split("base64,", 1)[1]
          compact = "".join(raw.split()).replace("-", "+").replace("_", "/")
          padding = (-len(compact)) % 4
          try:
              data = base64.b64decode(compact + ("=" * padding), validate=True)
          except Exception as exc:
              print(f"::error::Secret KEYSTORE_BASE64 invalide ({exc}). Vérifiez la chaîne Base64 complète de votre fichier .jks.")
              sys.exit(1)
          with open(os.environ["KEYSTORE_FILE"], "wb") as f:
              f.write(data)
          PY
          chmod 600 "$KEYSTORE_FILE"
          if ! keytool -list -keystore "$KEYSTORE_FILE" -alias upload -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Failed to verify keystore or locate alias 'upload'. Ensure your keystore has alias 'upload' and STORE_PASSWORD is correct."
            exit 1
          fi
          echo "Production keystore decoded and alias 'upload' verified."

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/proxiafrik-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Publish failure details to Summary
        if: failure()
        run: |
          {
            echo "### Erreur détectée pendant le build"
            echo '```'
            tail -n 80 /tmp/gradle-test.log /tmp/gradle-build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ls app/build/test-results/testDebugUnitTest/*.xml 1> /dev/null 2>&1; then
            grep -rnE "<failure|<error" app/build/test-results/testDebugUnitTest/*.xml || true
          fi
          ERR_LINE=$(grep -E "FAILURE:|What went wrong:|e: |Exception|Error|FAILED" /tmp/gradle-test.log /tmp/gradle-build.log 2>/dev/null | head -n 5 | tr '\n' ' ')
          if [ -n "$ERR_LINE" ]; then
            echo "::error::${ERR_LINE}"
          fi

      - name: Package and validate signed Release APK
        run: |
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Release APK not found at $APK_SOURCE"
            exit 1
          fi

          mkdir -p dist
          OUTPUT_APK="dist/${APK_FILENAME}"
          cp "$APK_SOURCE" "$OUTPUT_APK"

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK_DIR/build-tools"
            exit 1
          fi

          echo "Validating APK signature with: $APKSIGNER"
          CERT_OUT=$("$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK")
          echo "$CERT_OUT"

          # Ensure production APK is not accidentally signed with Android Debug key
          if printf '%s\n' "$CERT_OUT" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK appears to be signed with a debug certificate! Aborting release."
            exit 1
          fi

          REL_SHA1_HEX=$(printf '%s\n' "$CERT_OUT" | awk -F'SHA-1 digest: ' '/SHA-1 digest:/ {print $2; exit}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          REL_SHA256_HEX=$(printf '%s\n' "$CERT_OUT" | awk -F'SHA-256 digest: ' '/SHA-256 digest:/ {print $2; exit}' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          REL_SHA1_COLON=$(printf '%s' "$REL_SHA1_HEX" | tr '[:lower:]' '[:upper:]' | sed 's/\(..\)/\1:/g; s/:$//')
          REL_SHA256_COLON=$(printf '%s' "$REL_SHA256_HEX" | sed 's/\(..\)/\1:/g; s/:$//')

          {
            echo "### Empreintes du certificat Release"
            echo "- **SHA-1 :** \`$REL_SHA1_COLON\`"
            echo "- **SHA-256 :** \`$REL_SHA256_COLON\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$REL_SHA1_HEX" ] && ! grep -qi "$REL_SHA1_HEX" app/google-services.json; then
            echo "::warning::Le SHA-1 de votre keystore Release ($REL_SHA1_COLON) n'est pas encore dans app/google-services.json. Ajoutez-le dans Firebase Console pour que Google Sign-In fonctionne sur l'APK Release."
            {
              echo ""
              echo "> **Important pour Google Sign-In (APK Release) :** Ajoutez le SHA-1 ci-dessus dans **Firebase Console → Paramètres du projet → Vos applications (\`com.aistudio.proxiafrik.vzkpmn\`) → Ajouter une empreinte**, puis mettez à jour \`GOOGLE_SERVICES_JSON_BASE64\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          sha256sum "$OUTPUT_APK" > "${OUTPUT_APK}.sha256"
          ls -lh "$OUTPUT_APK" "${OUTPUT_APK}.sha256"
          cat "${OUTPUT_APK}.sha256"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/proxiafrik-release.jks"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ProxiAfrik ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ## ProxiAfrik ${{ env.RELEASE_TAG }}

            Version de production signée et vérifiée pour Android.

            ### Installation sur Android
            1. Téléchargez **`${{ env.APK_FILENAME }}`** ci-dessous.
            2. Ouvrez le fichier APK sur votre téléphone Android (autorisez l'installation depuis cette source si demandé).
            3. Vérifiez l'empreinte SHA-256 via `${{ env.APK_FILENAME }}.sha256` si nécessaire.
          files: |
            dist/${{ env.APK_FILENAME }}
            dist/${{ env.APK_FILENAME }}.sha256
