name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --tests 'com.example.ExampleRobolectricTest' --tests 'com.example.ExampleUnitTest' --no-daemon --console=plain

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Package PROXIAFRIK-debug.apk
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: Debug APK not found at $APK_SOURCE"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_SOURCE" dist/PROXIAFRIK-debug.apk
          ls -lh dist/PROXIAFRIK-debug.apk
          sha256sum dist/PROXIAFRIK-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROXIAFRIK-debug
          path: dist/PROXIAFRIK-debug.apk
          if-no-files-found: error
          retention-days: 30
