name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Firebase configuration (google-services.json)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          TARGET = "app/google-services.json"
          PKG = "com.aistudio.proxiafrik.vzkpmn"

          def is_valid_google_services(raw_text: str) -> tuple[bool, str]:
              try:
                  data = json.loads(raw_text)
              except Exception as exc:
                  return False, f"JSON invalide: {exc}"
              clients = data.get("client")
              if not isinstance(clients, list):
                  return False, "Champ 'client' manquant dans google-services.json"
              for client in clients:
                  pkg = (
                      client.get("client_info", {})
                      .get("android_client_info", {})
                      .get("package_name")
                  )
                  if pkg == PKG:
                      oauth_clients = client.get("oauth_client", [])
                      has_web_client = any(
                          isinstance(c, dict) and c.get("client_type") == 3
                          for c in oauth_clients
                      )
                      if not has_web_client:
                          return False, f"Client OAuth Web (client_type: 3) absent pour {PKG}"
                      return True, "OK"
              return False, f"Application {PKG} absente de google-services.json"

          def decode_secret(secret_value: str) -> tuple[str | None, str]:
              trimmed = secret_value.strip()
              if (trimmed.startswith('"') and trimmed.endswith('"')) or (
                  trimmed.startswith("'") and trimmed.endswith("'")
              ):
                  trimmed = trimmed[1:-1].strip()
              if trimmed.startswith("{"):
                  return trimmed, "raw JSON"
              if "base64," in trimmed[:64]:
                  trimmed = trimmed.split("base64,", 1)[1]
              compact = "".join(trimmed.split()).replace("-", "+").replace("_", "/")
              if not compact:
                  return None, "secret vide"
              padding = (-len(compact)) % 4
              compact_padded = compact + ("=" * padding)
              try:
                  decoded = base64.b64decode(compact_padded, validate=True).decode("utf-8")
                  return decoded, "Base64"
              except Exception as exc:
                  return None, f"Base64 invalide ({exc})"

          repo_valid = False
          if os.path.isfile(TARGET):
              with open(TARGET, "r", encoding="utf-8") as f:
                  repo_valid, repo_msg = is_valid_google_services(f.read())
          else:
              repo_msg = "fichier absent du dépôt"

          secret_val = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "")
          if secret_val.strip():
              decoded_text, mode = decode_secret(secret_val)
              if decoded_text is not None:
                  ok, msg = is_valid_google_services(decoded_text)
                  if ok:
                      os.makedirs(os.path.dirname(TARGET), exist_ok=True)
                      with open(TARGET, "w", encoding="utf-8") as f:
                          f.write(decoded_text)
                      print(f"app/google-services.json configuré via GOOGLE_SERVICES_JSON_BASE64 ({mode}).")
                      sys.exit(0)
                  else:
                      secret_err = msg
              else:
                  secret_err = mode

              if repo_valid:
                  print(f"::warning::GOOGLE_SERVICES_JSON_BASE64 ignoré ({secret_err}), utilisation du fichier app/google-services.json du dépôt.")
                  sys.exit(0)

              print(f"::error::Secret GOOGLE_SERVICES_JSON_BASE64 invalide ({secret_err}) et app/google-services.json absent du dépôt.")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as s:
                      s.write("### Erreur de configuration Firebase\n")
                      s.write(f"Le secret `GOOGLE_SERVICES_JSON_BASE64` est invalide ({secret_err}).\n\n")
                      s.write("Vous pouvez soit :\n")
                      s.write("1. Coller le contenu JSON complet de `app/google-services.json` (ou son Base64 exact sans coupure) dans `GOOGLE_SERVICES_JSON_BASE64`, **ou**\n")
                      s.write("2. Pousser `app/google-services.json` directement dans le dépôt et supprimer le secret `GOOGLE_SERVICES_JSON_BASE64`.\n")
              sys.exit(1)

          if repo_valid:
              print("Firebase app/google-services.json du dépôt vérifié.")
              sys.exit(0)

          print(f"::error::app/google-services.json invalide ou manquant ({repo_msg}).")
          sys.exit(1)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit and Robolectric tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests 'com.example.ExampleRobolectricTest' --tests 'com.example.ExampleUnitTest' --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle-test.log

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Publish failure details to Summary
        if: failure()
        run: |
          {
            echo "### Erreur détectée pendant le build"
            echo '```'
            tail -n 80 /tmp/gradle-test.log /tmp/gradle-build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ls app/build/test-results/testDebugUnitTest/*.xml 1> /dev/null 2>&1; then
            grep -rnE "<failure|<error" app/build/test-results/testDebugUnitTest/*.xml || true
          fi
          ERR_LINE=$(grep -E "FAILURE:|What went wrong:|e: |Exception|Error|FAILED" /tmp/gradle-test.log /tmp/gradle-build.log 2>/dev/null | head -n 5 | tr '\n' ' ')
          if [ -n "$ERR_LINE" ]; then
            echo "::error::${ERR_LINE}"
          fi

      - name: Package PROXIAFRIK-debug.apk
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: Debug APK not found at $APK_SOURCE"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_SOURCE" dist/PROXIAFRIK-debug.apk
          ls -lh dist/PROXIAFRIK-debug.apk
          sha256sum dist/PROXIAFRIK-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: PROXIAFRIK-debug
          path: dist/PROXIAFRIK-debug.apk
          if-no-files-found: error
          retention-days: 30
